[package]
name = "kclipsync"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Minimal plaintext LAN clipboard sync"

[[bin]]
name = "kclipsync"
path = "src/bin/kclipsync.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
flume = "0.12"
hostname = "0.4"
mdns-sd = "0.20"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
uuid = { version = "1.26", features = ["v4"] }
if-addrs = "0.15"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
